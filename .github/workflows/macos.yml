name: macOS App

# Builds the native macOS shell (Tauri 2 + WKWebView) around the full
# TSF Music engine, gated by a playback probe of the 20-track gauntlet set.
#
# Products (per architecture):
#   - TSF-Music-<version>-x64.dmg      ← Intel (MacBook Pro 16" 2019 i9 ✓)
#   - TSF-Music-<version>-arm64.dmg    ← Apple Silicon
#   - matching .zip app bundles
# Tag pushes (v*) additionally publish a GitHub Release — but ONLY if the
# probe job passed (the gauntlet enforces itself).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/desktop/**"
      - "prisma/**"
      - "next.config.ts"
      - "package.json"
      - ".github/workflows/macos.yml"
    tags: ["v*"]

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.0"

jobs:
  # ---------------------------------------------------------------------------
  # 1) Engine probe: boot the EXACT production engine (standalone + POT
  #    provider + yt-dlp) on a clean machine and resolve the 20-track set.
  # ---------------------------------------------------------------------------
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install deps
        run: bun install

      - name: Prisma generate + fresh database
        run: |
          bunx prisma generate
          DATABASE_URL=file:/tmp/probe.db bunx prisma db push --skip-generate

      - name: Install yt-dlp (zipapp) + deno (EJS solver)
        run: |
          sudo curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Start POT provider (bgutil, :4416)
        run: |
          cd mini-services/pot-provider
          bun install --production --backend copyfile
          nohup env PORT=4416 bun index.js > /tmp/pot.log 2>&1 &

      - name: Build engine (production standalone)
        run: bun run build

      - name: Start engine (:3100)
        run: |
          nohup env NODE_ENV=production PORT=3100 HOSTNAME=127.0.0.1 \
            DATABASE_URL=file:/tmp/probe.db \
            TSF_POT_URL=http://127.0.0.1:4416 \
            bun .next/standalone/server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/api/health > /dev/null 2>&1; then
              echo "engine healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::engine did not become healthy — server.log tail:"
          tail -50 /tmp/server.log
          exit 1

      - name: Run 20-track playback probe
        run: |
          BASE=http://127.0.0.1:3100 PROBE_MIN_FULL="${PROBE_MIN_FULL:-50}" \
            bun scripts/desktop/probe.mjs

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsf-probe-report
          path: probe-report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2) Native shell build (both CPU architectures; Intel is the user's target)
  # ---------------------------------------------------------------------------
  build:
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: intel-x64
          - target: aarch64-apple-darwin
            name: apple-silicon
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Rust target for cross-compile
        run: rustup target add ${{ matrix.target }}

      - name: Install deps + Prisma engines (darwin × both archs)
        run: |
          bun install
          bunx prisma generate

      - name: Build engine (production standalone)
        run: bun run build

      - name: Prepare bundled resources (bun runtime, deno, yt-dlp, pot-provider, db)
        env:
          BUN_VERSION: ${{ env.BUN_VERSION }}
        run: bash scripts/desktop/prepare-mac-resources.sh ${{ matrix.target }}

      - name: Tauri build (app bundle)
        run: bunx tauri build --target ${{ matrix.target }} --bundles app

      # -----------------------------------------------------------------------
      # Signing + notarization (the REAL Gatekeeper fix).
      # Ad-hoc signing (--sign -) makes the app launchable but macOS still
      # quarantines every fresh download: the user must clear the flag by hand
      # (First-Run script / Privacy settings) on EVERY new DMG. With a Developer
      # ID Application certificate + notarization, Gatekeeper clears downloads
      # silently — no prompts, no Privacy settings, ever.
      # Auto-activates when secrets exist; ad-hoc remains the fallback.
      # -----------------------------------------------------------------------
      - name: Codesign (Developer ID if secrets exist, else ad-hoc)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/TSF Music.app"
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "▶ Developer ID signing ($APPLE_SIGNING_IDENTITY)"
            # Password generated ONCE — re-running $(date +%s) later would tick
            # to a different second and lock us out of our own keychain.
            KC="tsf-signing.keychain"
            KC_PASS="tsf-$RANDOM-$RANDOM"
            security create-keychain -p "$KC_PASS" "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p "$KC_PASS" "$KC"
            CERT_P12="$RUNNER_TEMP/cert.p12"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_P12"
            security import "$CERT_P12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            # -s takes the keychain name (not a path); without it codesign
            # cannot use the key non-interactively.
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
            # ADD our keychain, do not clobber the runner's default search list.
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            rm -f "$CERT_P12"
            # --deep signs the nested helpers (bun / yt-dlp / deno / the POT
            # provider) too, which notarization REQUIRES: an unsigned Mach-O
            # anywhere in the bundle fails the notary review. The entitlements
            # keep the embedded JIT runtimes alive under the hardened runtime.
            codesign --force --deep --options runtime --timestamp \
              --entitlements src-tauri/entitlements.plist \
              --keychain "$KC" --sign "$APPLE_SIGNING_IDENTITY" "$APP"
            # Inside-out proof: notarization rejects the whole submission if ANY
            # nested Mach-O (bun, deno, yt-dlp, the native POT/provider modules)
            # is not signed with the Developer ID identity. Audit every Mach-O
            # under Resources and report the ones that would fail the notary.
            # Deliberately does NOT fail the build here — a false positive must
            # not block a release; the warning names the exact binaries.
            echo "--- nested signature audit (Mach-O only) ---"
            UNSIGNED=0
            AUDITED=0
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              file -b "$f" | grep -q "Mach-O" || continue
              AUDITED=$((AUDITED + 1))
              if codesign -dv --verbose=4 "$f" 2>&1 | grep -q "Authority=Developer ID Application"; then
                echo "  ok   $f"
              else
                UNSIGNED=$((UNSIGNED + 1))
                echo "  MISS $f"
              fi
            done < <(find "$APP/Contents/Resources" -type f -perm -u+x 2>/dev/null)
            echo "audited ${AUDITED} Mach-O helper(s); ${UNSIGNED} without a Developer ID signature"
            if [ "$UNSIGNED" -ne 0 ]; then
              echo "::warning title=Nested helpers not Developer ID signed::${UNSIGNED} of ${AUDITED} Mach-O helpers under Contents/Resources lack a Developer ID signature — notarization will reject this build. Sign them with the same identity (or use a --deep --force re-sign) before submitting."
            fi
            echo "TSF_SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "▶ No signing secrets — ad-hoc (First-Run script still required)"
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP" && echo "codesign OK"

      - name: Notarize + staple the app bundle (only when Developer ID signed)
        if: env.TSF_SIGNED == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/TSF Music.app"
          ZIP="$RUNNER_TEMP/notarize.zip"
          rm -f "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"
          # notarytool wants a duration string (30m), not raw seconds.
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          # Gatekeeper oracle: must report "accepted" for a notarized+stapled app.
          spctl -a -vv -t exec "$APP"

      - name: Package DMG + zip
        run: |
          # NOTARIZE THE DMG ITSELF (stapled): Gatekeeper validates the disk
          # image on first mount — an unstapled DMG containing a notarized app
          # still triggers the "cannot check for malicious software" dialog.
          # Defer to the next step for the stapling (needs the built DMG).
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          case "${{ matrix.target }}" in
            x86_64-apple-darwin) ARCH=x64 ;;
            aarch64-apple-darwin) ARCH=arm64 ;;
          esac
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/TSF Music.app"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          cp desktop/First-Run-MacOS.command "$STAGE/"
          cp desktop/README-MACOS.md "$STAGE/README.txt"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "TSF-Music-${VERSION}-${ARCH}.zip"
          hdiutil create -volname "TSF Music" -srcfolder "$STAGE" -ov -format UDZO \
            "TSF-Music-${VERSION}-${ARCH}.dmg"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ARCH=${ARCH}" >> "$GITHUB_ENV"

      # A notary ticket is bound to the artifact you SUBMIT. Submitting the
      # .app does NOT allow stapling the DMG — so the DMG is submitted and
      # stapled in its own right. The DMG is what users download, so it is the
      # one whose stapling removes the "cannot check for malicious software"
      # dialog on first mount.
      - name: Notarize + staple the DMGs
        if: env.TSF_SIGNED == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for DMG in TSF-Music-*.dmg; do
            [ -e "$DMG" ] || continue
            echo "▶ notarizing $DMG"
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 30m
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG" && echo "stapled OK: $DMG"
          done

      # -----------------------------------------------------------------------
      # GAUNTLET BAR: the shipped .app must boot its OWN bundled engine.
      # The probe job runs bun on LINUX; only this step executes the exact
      # packaged Mach-O bun + server + db on real darwin — catching quarantine-
      # adjacent issues, darwin-only runtime crashes and the space-containing
      # DATABASE_URL ("Application Support") that the v0.1.0 build shipped with.
      # -----------------------------------------------------------------------
      - name: Smoke — boot the packaged engine exactly like the shell
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/TSF Music.app"
          RES="$APP/Contents/Resources"
          # absolutize: the server subshell cd's into the bundle, so a relative
          # RES would break every path used after the cd (v0.1.1 smoke bug)
          RES="$(cd "$RES" && pwd)"
          test -x "$RES/resources/runtime/bun" || { echo "::error::bundled bun missing/not executable"; exit 1; }
          test -f "$RES/resources/server/server.js" || { echo "::error::server.js missing in bundle"; exit 1; }
          test -f "$RES/resources/pot-provider/index.js" || { echo "::error::pot-provider missing"; exit 1; }
          test -x "$RES/resources/bin/yt-dlp" || { echo "::error::yt-dlp missing"; exit 1; }
          "$RES/resources/bin/yt-dlp" --version

          # x64 bundle runs under Rosetta on this arm64 runner — install if absent
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          fi

          # Space-containing data dir — regression-tests the percent-encoded
          # DATABASE_URL the shell builds for "~/Library/Application Support"
          SMOKE="$HOME/Library/Application Support/tsf-smoke"
          mkdir -p "$SMOKE"
          cp "$RES/resources/db/tsf.db" "$SMOKE/tsf.db"
          DBURL="file:$(echo "$SMOKE/tsf.db" | sed 's/ /%20/g')"
          echo "smoke DATABASE_URL: $DBURL"

          env PORT=4416 "$RES/resources/runtime/bun" \
            "$RES/resources/pot-provider/index.js" > /tmp/smoke-pot.log 2>&1 &
          POT_PID=$!
          (
            cd "$RES/resources/server"
            env NODE_ENV=production PORT=3199 HOSTNAME=127.0.0.1 DATABASE_URL="$DBURL" \
              TSF_POT_URL=http://127.0.0.1:4416 TSF_RESOURCES="$RES" \
              TSF_YTDLP_BIN="$RES/resources/bin/yt-dlp" NEXT_TELEMETRY_DISABLED=1 \
              PATH="$RES/resources/bin:$PATH" \
              "$RES/resources/runtime/bun" server.js > /tmp/smoke-server.log 2>&1
          ) &
          SRV_PID=$!

          OK=0
          for i in $(seq 1 90); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3199/api/health || true)
            if [ "$CODE" = "200" ]; then echo "packaged engine healthy after ${i}s"; OK=1; break; fi
            sleep 1
          done
          kill $POT_PID $SRV_PID 2>/dev/null || true
          pkill -f "resources/server/server.js" 2>/dev/null || true
          pkill -f "resources/pot-provider/index.js" 2>/dev/null || true
          if [ "$OK" != "1" ]; then
            echo "::error::packaged engine did not become healthy — logs:"
            tail -40 /tmp/smoke-server.log || true
            tail -20 /tmp/smoke-pot.log || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:3199/api/health | head -c 400; echo
          ROOT_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3199/ || true)
          echo "engine root page: HTTP $ROOT_CODE"
          if [ "$ROOT_CODE" != "200" ]; then
            echo "::error::engine root page did not return 200"
            exit 1
          fi
          rm -rf "$SMOKE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TSF-Music-macos-${{ matrix.name }}
          path: |
            TSF-Music-*-x64.dmg
            TSF-Music-*-arm64.dmg
            TSF-Music-*-x64.zip
            TSF-Music-*-arm64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3) Static checks: Rust compiles (linux cargo check) + lint + typecheck
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Lint + typecheck (web layer)
        run: |
          bun install
          # The generated Prisma client (node_modules/.prisma) is gitignored —
          # without this, @prisma/client is a stub with no PrismaClient export
          # and tsc cascades dozens of false errors (seen 2026-08-28).
          bunx prisma generate
          bun run lint
          bunx tsc -p tsconfig.ci.json

      - name: apt deps for Tauri (linux check)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential curl wget file

      - name: Stub bundle resources (tauri-build validates resource globs)
        run: |
          mkdir -p src-tauri/resources/{bin,runtime,db,pot-provider,server}
          touch src-tauri/resources/bin/placeholder \
                src-tauri/resources/runtime/placeholder \
                src-tauri/resources/db/placeholder \
                src-tauri/resources/pot-provider/placeholder \
                src-tauri/resources/server/placeholder

      - name: cargo check (Rust shell)
        run: cd src-tauri && cargo check --all-targets

  # ---------------------------------------------------------------------------
  # 4) Release (tags only) — gated by the probe gauntlet
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [probe, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
