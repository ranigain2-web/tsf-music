<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>TSF Music</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: #000; color: #fff;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 32px; text-align: center;
    }
    .logo {
      width: 88px; height: 88px; border-radius: 22px;
      background: linear-gradient(135deg, #1ed760 0%, #0d9440 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 40px rgba(30, 215, 96, 0.25);
    }
    .logo svg { width: 46px; height: 46px; }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    p  { font-size: 14px; line-height: 1.6; color: #b3b3b3; max-width: 300px; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.45 } }
    code { color: #1ed760; font-size: 12px; background: #181818; padding: 2px 7px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13" />
      <circle cx="6" cy="18" r="3" />
      <circle cx="18" cy="16" r="3" />
    </svg>
  </div>
  <h1>TSF Music</h1>
  <p class="pulse">Connecting to your TSF server…</p>
  <p>Make sure your server is running and this phone is on the same network.<br /><br />Server: <code id="srv">—</code></p>
  <script>
    // Fallback landing shell. With `server.url` configured in
    // capacitor.config.json, Capacitor loads the real app from the server and
    // this page is never seen. It exists as the bundled origin so the project
    // builds cleanly and as the foundation for a future offline/settings UI.
    try {
      const cfg = window.Capacitor && window.Capacitor.getConfig && window.Capacitor.getConfig()
      document.getElementById('srv').textContent = (cfg && cfg.server && cfg.server.url) || 'not configured'
    } catch (e) {}
  </script>
</body>
</html>
