<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSF Music</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: #121212;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        display: flex; align-items: center; justify-content: center;
        -webkit-user-select: none; user-select: none;
      }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      .mark {
        width: 84px; height: 84px; border-radius: 22px;
        background: #1ed760;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 40px rgba(30, 215, 96, 0.25);
      }
      .mark svg { width: 46px; height: 46px; fill: #121212; }
      h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.2px; }
      p { font-size: 14px; color: #a7a7a7; max-width: 420px; text-align: center; line-height: 1.5; }
      .bar { width: 220px; height: 4px; border-radius: 2px; background: #2a2a2a; overflow: hidden; }
      .bar i {
        display: block; height: 100%; width: 40%; border-radius: 2px; background: #1ed760;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(350%);} }
      .err { display: none; color: #f15e6c; white-space: pre-wrap; max-width: 480px; word-break: break-word; }
      .hint { display: none; font-size: 12px; color: #7f7f7f; text-align: center; max-width: 460px; line-height: 1.5; }
      .hint b { color: #a7a7a7; }
      .retry {
        display: inline-flex; align-items: center; justify-content: center;
        height: 40px; padding: 0 24px; border: 0; border-radius: 500px;
        background: #1ed760; color: #121212; font-size: 14px; font-weight: 700;
        font-family: inherit; letter-spacing: 0.2px; cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .retry:hover { background: #3be477; transform: scale(1.04); }
      .retry:active { transform: scale(0.97); }
      code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #7f7f7f; }
      @media (prefers-reduced-motion: reduce) { .bar i { animation: none; } }
    </style>
  </head>
  <body>
    <main class="wrap" aria-live="polite">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.6 14.5a.8.8 0 0 1-1.1.3c-3-1.8-6.7-2.2-11.1-1.2a.8.8 0 1 1-.3-1.5c4.8-1.1 8.9-.6 12.2 1.4.4.2.5.7.3 1zm1.2-2.9a1 1 0 0 1-1.3.3c-3.4-2.1-8.6-2.7-12.6-1.5a1 1 0 1 1-.6-1.9c4.6-1.4 10.3-.7 14.2 1.7.5.3.6.9.3 1.4zm.1-3a1.2 1.2 0 0 1-1.6.4C12.4 8.6 6.3 8.4 2.8 9.5a1.2 1.2 0 1 1-.7-2.3c4-1.2 10.8-1 15 1.5.6.3.8 1.1.4 1.6z"/></svg>
      </div>
      <h1>Starting the TSF Music engine</h1>
      <p id="status">Booting the local playback engine and token service — this takes a few seconds on first launch.</p>
      <div class="bar" aria-hidden="true"><i></i></div>
      <p class="err" id="err"></p>
      <p class="hint" id="hint">Full logs: <code>~/Library/Logs/com.tsfmusic.desktop</code><br />If this repeats, re-run <b>First-Run-MacOS.command</b> from the DMG, then press Retry.</p>
      <button id="retry" type="button" style="display:none" class="retry">Retry</button>
      <p><code>com.tsfmusic.desktop</code></p>
    </main>
    <script>
      var statusEl = document.getElementById("status");
      var errBox = document.getElementById("err");
      var hintEl = document.getElementById("hint");
      var bar = document.querySelector(".bar");
      var retry = document.getElementById("retry");

      function fail(msg) {
        bar.style.display = "none";
        statusEl.textContent = "The engine failed to start.";
        errBox.style.display = "block";
        errBox.textContent = (msg || "Unknown error") + "";
        hintEl.style.display = "block";
        retry.style.display = "inline-flex";
      }

      window.addEventListener("tsf-boot-error", function (e) { fail(e.detail); });
      window.addEventListener("tsf-boot-status", function (e) {
        if (e.detail && e.detail.text) statusEl.textContent = e.detail.text;
      });

      retry.addEventListener("click", function () {
        retry.style.display = "none";
        errBox.style.display = "none";
        hintEl.style.display = "none";
        bar.style.display = "block";
        statusEl.textContent = "Restarting the engine…";
        try {
          var t = window.__TAURI__;
          if (t && t.core && typeof t.core.invoke === "function") {
            t.core.invoke("boot_retry");
          } else {
            location.reload();
          }
        } catch (e) {
          location.reload();
        }
      });
    </script>
  </body>
</html>
