[package]
name = "tsf-music-desktop"
version = "0.1.1"
description = "TSF Music — AI music player (macOS/Windows/Linux shell)"
authors = ["TSF Music"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tsf_music_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
souvlaki = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
