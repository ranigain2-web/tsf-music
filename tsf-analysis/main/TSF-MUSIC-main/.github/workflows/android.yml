name: Build Android APK

# TSF Music native shell factory.
#
# What it does:
#   1. bakes the TSF server URL (secret TSF_SERVER_URL, overridable via
#      workflow_dispatch input) into capacitor.config.json
#   2. `cap sync` copies the shell + config into the committed android/ project
#   3. gradle assembles debug + SIGNED RELEASE APKs (keystore from secrets)
#   4. uploads both as artifacts; on `v*` tags also publishes a GitHub Release
#
# Why no `next build` here: the WebView loads the app from the server at
# runtime (server.url) — the APK only contains the native shell + fallback
# page, so this workflow is fast (~3-4 min) and can't break from web changes.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "TSF server URL baked into this APK (overrides the repo secret)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "android/**"
      - "mobile-shell/**"
      - "capacitor.config.json"
      - "assets/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to publish GitHub Releases on v* tags

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ── server URL resolution: dispatch input > repo secret > default ──
      - name: Resolve server URL
        id: srv
        run: |
          URL="${{ github.event.inputs.server_url }}"
          if [ -z "$URL" ]; then URL="${{ secrets.TSF_SERVER_URL }}"; fi
          if [ -z "$URL" ]; then URL="http://10.125.110.1:3000"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Baking server URL: $URL"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (capacitor CLI)
        run: bun install --frozen-lockfile

      - name: Bake server URL into capacitor config
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.server = cfg.server || {};
            cfg.server.url = process.env.TSF_SERVER_URL;
            cfg.server.cleartext = String(cfg.server.url).startsWith("http://");
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2) + "\n");
            console.log("capacitor.config.json →", JSON.stringify(cfg.server));
          '
        env:
          TSF_SERVER_URL: ${{ steps.srv.outputs.url }}

      - name: Capacitor sync (copy shell + config into android/)
        run: bunx cap sync android

      # ── versioning: versionCode = run number (monotonic → clean upgrades
      #    over previous installs), versionName = tag or 1.0.<run> ──
      - name: Stamp version
        run: |
          RUN="${{ github.run_number }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="1.0.${RUN}"
          fi
          sed -i "s/versionCode 1$/versionCode ${RUN}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle | head -2

      # ── release signing: decode keystore from secrets to a gitignored file ──
      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/tsf-release.keystore
          ls -la android/app/tsf-release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Runner images ship the Android SDK; this defensively guarantees the
      # exact platform/build-tools the project targets exist + licenses OK.
      - name: Ensure Android SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms" || ls /usr/local/lib/android/sdk/platforms

      - name: Build APKs (debug + signed release)
        working-directory: android
        env:
          TSF_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'tsf-release.keystore' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Verify APK outputs
        run: |
          ls -la android/app/build/outputs/apk/debug/ || true
          ls -la android/app/build/outputs/apk/release/ || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tsf-music-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tsf-music-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
